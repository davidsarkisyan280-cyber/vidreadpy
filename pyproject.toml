[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidreadpy"
version = "0.1.0"
authors = [
  { name="davidsarkisyan280-cyber", email="davidsarkisyan280@gmail.com" },
]
description = "Лёгкая библиотека для чтения видео на Python через FFmpeg (без OpenCV)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["video", "ffmpeg", "frames", "metadata", "reader"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "ffmpeg-python>=0.2.0",
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/ваш_логин/vidreadpy"
Issues = "https://github.com/ваш_логин/vidreadpy/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "tqdm"]